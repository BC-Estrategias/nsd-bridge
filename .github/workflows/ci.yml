name: ci
on:
  push:
  pull_request:

jobs:
  host:
    name: host (C core + TypeScript) on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Full check (vectors, C build + tests, tsc, TS tests)
        run: ./scripts/check.sh

  typescript-windows:
    name: TypeScript on Windows (no C host agent)
    runs-on: windows-latest
    env:
      NDP_SKIP_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
        working-directory: bridge
      - run: npx tsc -p tsconfig.json --noEmit
        working-directory: bridge
      - run: npm test
        working-directory: bridge

  agent-3ds:
    name: 3DS agent (.3dsx)
    runs-on: ubuntu-latest
    # The toolchain comes from pkg.devkitpro.org, which answers 403 to CI runners for hours at a time (an outage on their
    # side, not a code failure). The job still runs and reports, but does not turn the whole workflow red; the 3DS
    # build is also verified locally by ./scripts/check.sh --3ds.
    continue-on-error: true
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 3DS toolchain packages
        # pkg.devkitpro.org sometimes answers 403 to shared CI runners: retry with a growing pause
        run: |
          for i in 1 2 3 4 5 6; do
            if dkp-pacman -Syu --noconfirm 3ds-dev 3ds-curl 3ds-mbedtls 3ds-zlib 3ds-jansson; then exit 0; fi
            echo "attempt $i failed; retrying"; sleep $((i * 20))
          done
          exit 1
      - name: Build
        run: make -C agent/3ds
      - name: Checksums
        run: |
          VERSION="$(sed -n 's/^#define NDP_AGENT_VERSION "\(.*\)"$/\1/p' agent/common/include/ndp/ndp_defs.h)"
          mkdir -p dist
          cp agent/3ds/nsd-bridge.3dsx "dist/nsd-bridge-v${VERSION}.3dsx"
          cp agent/3ds/nsd-bridge.smdh "dist/nsd-bridge-v${VERSION}.smdh"
          cd dist && sha256sum nsd-bridge-v${VERSION}.3dsx nsd-bridge-v${VERSION}.smdh | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nsd-bridge-3ds
          path: dist/
